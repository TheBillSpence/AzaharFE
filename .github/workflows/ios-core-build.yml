
name: iOS ARM64 Core Build and Validation

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/ios-core-build.yml'

permissions:
  contents: read

jobs:
  build-ios-core:
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Azahar
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show Apple build environment
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          clang --version
          cmake --version

      - name: Install build tools
        run: |
          brew install ninja

      - name: Patch LibreSSL syslog for iOS
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path("externals/libressl/crypto/cryptlib.c")

          if not path.exists():
              raise SystemExit("ERROR: LibreSSL cryptlib.c was not found.")

          text = path.read_text()

          old = """\tstruct syslog_data sdata = SYSLOG_DATA_INIT;
          \tva_list ap;

          \tva_start(ap, fmta);
          \tvsyslog_r(LOG_INFO|LOG_LOCAL2, &sdata, fmta, ap);
          \tva_end(ap);"""

          new = """\tva_list ap;

          \tva_start(ap, fmta);
          \tvsyslog(LOG_INFO|LOG_LOCAL2, fmta, ap);
          \tva_end(ap);"""

          if new in text:
              print("LibreSSL syslog already patched.")
          elif old in text:
              text = text.replace(old, new, 1)
              path.write_text(text)
              print("LibreSSL syslog patched successfully.")
          else:
              raise SystemExit(
                  "ERROR: Could not find the expected LibreSSL syslog block."
              )
          PY

      - name: Patch LibreSSL explicit_bzero for iOS
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          roots = [
              Path("externals/libressl/crypto"),
              Path("externals/libressl/ssl"),
          ]

          for root in roots:
              if not root.is_dir():
                  raise SystemExit(f"ERROR: LibreSSL folder was not found: {root}")

          def find_call_end(source, opening):
              depth = 1
              i = opening + 1
              while i < len(source):
                  char = source[i]

                  if char == '"' or char == "'":
                      quote = char
                      i += 1
                      while i < len(source):
                          if source[i] == "\\":
                              i += 2
                              continue
                          if source[i] == quote:
                              break
                          i += 1
                  elif char == "(":
                      depth += 1
                  elif char == ")":
                      depth -= 1
                      if depth == 0:
                          return i
                  i += 1
              raise ValueError("Unmatched parentheses in explicit_bzero call")

          def split_arguments(source):
              depth = 0
              for i, char in enumerate(source):
                  if char == "(":
                      depth += 1
                  elif char == ")":
                      depth -= 1
                  elif char == "," and depth == 0:
                      return source[:i].strip(), source[i + 1:].strip()
              raise ValueError("Could not split explicit_bzero arguments")

          patched = 0

          paths = []
          for root in roots:
              paths.extend(root.rglob("*.c"))
              paths.extend(root.rglob("*.h"))

          for path in paths:
              source = path.read_text()
              output = []
              position = 0
              changed = False

              while True:
                  start = source.find("explicit_bzero", position)

                  if start == -1:
                      output.append(source[position:])
                      break

                  before = source[start - 1] if start > 0 else " "
                  after_name = start + len("explicit_bzero")

                  if (before.isalnum() or before == "_"
                      or after_name >= len(source)
                      or source[after_name] != "("):
                      output.append(source[position:after_name])
                      position = after_name
                      continue

                  opening = after_name
                  ending = find_call_end(source, opening)
                  first, second = split_arguments(
                      source[opening + 1:ending]
                  )

                  replacement = (
                      "{ "
                      "volatile unsigned char *azahar_bzero_p = "
                      "(volatile unsigned char *)(" + first + "); "
                      "size_t azahar_bzero_n = (size_t)(" + second + "); "
                      "while (azahar_bzero_n != 0) { "
                      "*azahar_bzero_p++ = 0; "
                      "--azahar_bzero_n; "
                      "} "
                      "}"
                  )

                  output.append(source[position:start])
                  output.append(replacement)
                  position = ending + 1
                  changed = True
                  patched += 1

              if changed:
                  path.write_text("".join(output))
                  print(f"Patched: {path}")

          print(f"Total explicit_bzero calls patched: {patched}")
          PY

      - name: Configure iOS ARM64 build
        run: |
          set -euo pipefail

          cmake -S . -B build-ios \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY="" \
            -DENABLE_TESTS=OFF \
            -DENABLE_QT=OFF \
            -DENABLE_SDL2=OFF \
            -DENABLE_ROOM=OFF \
            -DENABLE_ROOM_STANDALONE=OFF \
            -DENABLE_LIBUSB=OFF \
            -DENABLE_CUBEB=OFF \
            -DENABLE_OPENAL=OFF \
            -DENABLE_FFMPEG=OFF \
            -DENABLE_DISCORD_RPC=OFF \
            -DENABLE_WEB_SERVICE=OFF \
            -DENABLE_SCRIPTING=OFF \
            -DENABLE_GDBSTUB=OFF \
            -DENABLE_OPENGL=OFF \
            -DENABLE_VULKAN=OFF \
            -DENABLE_SOFTWARE_RENDERER=ON \
            -DENABLE_LTO=OFF \
            -DCITRA_USE_PRECOMPILED_HEADERS=OFF \
            -DCITRA_WARNINGS_AS_ERRORS=OFF

      - name: Save CMake configuration
        run: |
          set -euo pipefail

          mkdir -p artifacts

          cp build-ios/CMakeCache.txt \
            artifacts/CMakeCache.txt

          cmake --build build-ios --target help \
            > artifacts/available-targets.txt

      - name: Build Azahar core
        run: |
          set -euo pipefail

          cmake --build build-ios \
            --target citra_core \
            --parallel 3

      - name: Validate ARM64 library
        run: |
          set -euo pipefail

          library="$(find build-ios \
            -name 'libcitra_core.a' \
            -print -quit)"

          if [[ -z "$library" ]]; then
            echo "::error::citra_core library was not produced."
            find build-ios -maxdepth 5 -type f | head -200
            exit 1
          fi

          archs="$(lipo -archs "$library")"

          echo "Library: $library"
          echo "Architectures: $archs"

          lipo "$library" -verify_arch arm64

          mkdir -p artifacts

          cp "$library" artifacts/libcitra_core-ios-arm64.a

          echo "ARM64 core validation successful."

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: azahar-ios-arm64-core-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
