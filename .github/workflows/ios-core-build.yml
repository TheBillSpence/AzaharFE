
name: iOS ARM64 Core Build and Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios-core:
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Azahar
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Patch LibreSSL syslog for iOS
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path("externals/libressl/crypto/cryptlib.c")

          if not path.exists():
              raise SystemExit("ERROR: LibreSSL cryptlib.c was not found.")

          text = path.read_text()

          old = """\tstruct syslog_data sdata = SYSLOG_DATA_INIT;
          \tva_list ap;

          \tva_start(ap, fmta);
          \tvsyslog_r(LOG_INFO|LOG_LOCAL2, &sdata, fmta, ap);
          \tva_end(ap);"""

          new = """\tva_list ap;

          \tva_start(ap, fmta);
          \tvsyslog(LOG_INFO|LOG_LOCAL2, fmta, ap);
          \tva_end(ap);"""

          if new in text:
              print("LibreSSL syslog already patched.")
          elif old in text:
              text = text.replace(old, new, 1)
              path.write_text(text)
              print("LibreSSL syslog patched successfully.")
          else:
              raise SystemExit(
                  "ERROR: Could not find the expected LibreSSL syslog block."
              )
          PY

      - name: Patch LibreSSL explicit_bzero for iOS
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("externals/libressl/crypto/mem_clr.c")

          if not path.exists():
              raise SystemExit("ERROR: LibreSSL mem_clr.c was not found.")

          text = path.read_text()

          pattern = re.compile(
              r"(?m)^([ \t]*)explicit_bzero\(ptr,\s*len\);[ \t]*$"
          )

          if "volatile unsigned char *vptr" in text:
              print("LibreSSL explicit_bzero already patched.")
          else:
              replacement = (
                  r"\1volatile unsigned char *vptr = "
                  r"(volatile unsigned char *)ptr;" "\n"
                  r"\1while (len != 0) {" "\n"
                  r"\1    *vptr++ = 0;" "\n"
                  r"\1    len--;" "\n"
                  r"\1}"
              )

              text, count = pattern.subn(replacement, text, count=1)

              if count != 1:
                  raise SystemExit(
                      "ERROR: Could not find the expected explicit_bzero call."
                  )

              path.write_text(text)
              print("LibreSSL explicit_bzero patched successfully.")
          PY

      - name: Show Apple build environment
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          clang --version
          cmake --version

      - name: Install build tools
        run: |
          brew install ninja

      - name: Configure iOS ARM64 build
        run: |
          set -euo pipefail

          cmake -S . -B build-ios \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY="" \
            -DENABLE_TESTS=OFF \
            -DENABLE_QT=OFF \
            -DENABLE_SDL2=OFF \
            -DENABLE_ROOM=OFF \
            -DENABLE_ROOM_STANDALONE=OFF \
            -DENABLE_LIBUSB=OFF \
            -DENABLE_CUBEB=OFF \
            -DENABLE_OPENAL=OFF \
            -DENABLE_FFMPEG=OFF \
            -DENABLE_DISCORD_RPC=OFF \
            -DENABLE_WEB_SERVICE=OFF \
            -DENABLE_SCRIPTING=OFF \
            -DENABLE_GDBSTUB=OFF \
            -DENABLE_OPENGL=OFF \
            -DENABLE_VULKAN=OFF \
            -DENABLE_SOFTWARE_RENDERER=ON \
            -DENABLE_LTO=OFF \
            -DCITRA_USE_PRECOMPILED_HEADERS=OFF \
            -DCITRA_WARNINGS_AS_ERRORS=OFF

      - name: Save CMake configuration
        run: |
          set -euo pipefail

          mkdir -p artifacts

          cp build-ios/CMakeCache.txt \
            artifacts/CMakeCache.txt

          cmake --build build-ios --target help \
            > artifacts/available-targets.txt

      - name: Build Azahar core
        run: |
          set -euo pipefail

          cmake --build build-ios \
            --target citra_core \
            --parallel 3

      - name: Validate ARM64 library
        run: |
          set -euo pipefail

          library="$(find build-ios \
            -name 'libcitra_core.a' \
            -print -quit)"

          if [[ -z "$library" ]]; then
            echo "::error::citra_core library was not produced."
            find build-ios -maxdepth 5 -type f | head -200
            exit 1
          fi

          archs="$(lipo -archs "$library")"

          echo "Library: $library"
          echo "Architectures: $archs"

          lipo -verify_arch arm64 "$library"

          mkdir -p artifacts

          cp "$library" artifacts/libcitra_core-ios-arm64.a

          echo "ARM64 core validation successful."

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: azahar-ios-arm64-core-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
