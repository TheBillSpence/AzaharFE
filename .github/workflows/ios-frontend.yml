name: Azahar iOS JIT + FPS Experiment

on:
  workflow_dispatch:
  push:
    branches: [ios-jit-experiment]
    paths:
      - 'ios-app/**'
      - 'src/citra_libretro/core_settings.cpp'
      - '.github/workflows/ios-frontend.yml'

permissions:
  contents: read

jobs:
  ios-frontend:
    runs-on: macos-26
    timeout-minutes: 120

    steps:
      - name: Checkout Azahar and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools
        run: brew install ninja xcodegen

      - name: Show environment
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcodegen --version
          cmake --version

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          cd ios-app
          xcodegen generate

      - name: Build iPhone application shell
        run: |
          set -euo pipefail
          xcodebuild -project ios-app/AzaharIOS.xcodeproj \
            -scheme AzaharIOS \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios-app/.derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Stamp build number for bottom-left version badge
        run: |
          set -euo pipefail
          app="ios-app/.derived/Build/Products/Release-iphoneos/AzaharIOS.app"
          test -f "$app/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${GITHUB_RUN_NUMBER}" "$app/Info.plist"
          echo "Azahar iOS experimental build ${GITHUB_RUN_NUMBER}"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$app/Info.plist"

      - name: Patch LibreSSL syslog for iOS
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path("externals/libressl/crypto/cryptlib.c")

          if not path.exists():
              raise SystemExit("ERROR: LibreSSL cryptlib.c was not found.")

          text = path.read_text()

          old = """\tstruct syslog_data sdata = SYSLOG_DATA_INIT;
          \tva_list ap;

          \tva_start(ap, fmta);
          \tvsyslog_r(LOG_INFO|LOG_LOCAL2, &sdata, fmta, ap);
          \tva_end(ap);"""

          new = """\tva_list ap;

          \tva_start(ap, fmta);
          \tvsyslog(LOG_INFO|LOG_LOCAL2, fmta, ap);
          \tva_end(ap);"""

          if new in text:
              print("LibreSSL syslog already patched.")
          elif old in text:
              text = text.replace(old, new, 1)
              path.write_text(text)
              print("LibreSSL syslog patched successfully.")
          else:
              raise SystemExit(
                  "ERROR: Could not find the expected LibreSSL syslog block."
              )
          PY

      - name: Patch LibreSSL explicit_bzero for iOS
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          roots = [
              Path("externals/libressl/crypto"),
              Path("externals/libressl/ssl"),
          ]

          for root in roots:
              if not root.is_dir():
                  raise SystemExit(f"ERROR: LibreSSL folder was not found: {root}")

          def find_call_end(source, opening):
              depth = 1
              i = opening + 1
              while i < len(source):
                  char = source[i]

                  if char == '"' or char == "'":
                      quote = char
                      i += 1
                      while i < len(source):
                          if source[i] == "\\":
                              i += 2
                              continue
                          if source[i] == quote:
                              break
                          i += 1
                  elif char == "(":
                      depth += 1
                  elif char == ")":
                      depth -= 1
                      if depth == 0:
                          return i
                  i += 1
              raise ValueError("Unmatched parentheses in explicit_bzero call")

          def split_arguments(source):
              depth = 0
              for i, char in enumerate(source):
                  if char == "(":
                      depth += 1
                  elif char == ")":
                      depth -= 1
                  elif char == "," and depth == 0:
                      return source[:i].strip(), source[i + 1:].strip()
              raise ValueError("Could not split explicit_bzero arguments")

          patched = 0

          paths = []
          for root in roots:
              paths.extend(root.rglob("*.c"))
              paths.extend(root.rglob("*.h"))

          for path in paths:
              source = path.read_text()
              output = []
              position = 0
              changed = False

              while True:
                  start = source.find("explicit_bzero", position)

                  if start == -1:
                      output.append(source[position:])
                      break

                  before = source[start - 1] if start > 0 else " "
                  after_name = start + len("explicit_bzero")

                  if (before.isalnum() or before == "_"
                      or after_name >= len(source)
                      or source[after_name] != "("):
                      output.append(source[position:after_name])
                      position = after_name
                      continue

                  opening = after_name
                  ending = find_call_end(source, opening)
                  first, second = split_arguments(
                      source[opening + 1:ending]
                  )

                  replacement = (
                      "{ "
                      "volatile unsigned char *azahar_bzero_p = "
                      "(volatile unsigned char *)(" + first + "); "
                      "size_t azahar_bzero_n = (size_t)(" + second + "); "
                      "while (azahar_bzero_n != 0) { "
                      "*azahar_bzero_p++ = 0; "
                      "--azahar_bzero_n; "
                      "} "
                      "}"
                  )

                  output.append(source[position:start])
                  output.append(replacement)
                  position = ending + 1
                  changed = True
                  patched += 1

              if changed:
                  path.write_text("".join(output))
                  print(f"Patched: {path}")

          print(f"Total explicit_bzero calls patched: {patched}")
          PY

      - name: Patch Dynarmic and Oaknut for iOS dual-mapped JIT
        run: |
          set -euo pipefail
          python3 ios-app/patches/apply-ios-jit-memory.py

      - name: Configure libretro software core for iOS ARM64
        run: |
          set -euo pipefail
          cmake -S . -B build-ios-libretro \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DHAVE_REALLOCARRAY=OFF \
            -DHAVE_TIMINGSAFE_MEMCMP=OFF \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_C_FLAGS=-DIOS \
            -DCMAKE_CXX_FLAGS=-DIOS \
            -DIOS=ON \
            -DENABLE_LIBRETRO=ON \
            -DENABLE_QT=OFF \
            -DENABLE_SDL2=OFF \
            -DENABLE_OPENGL=OFF \
            -DENABLE_VULKAN=OFF \
            -DENABLE_SOFTWARE_RENDERER=ON \
            -DENABLE_LTO=OFF \
            -DENABLE_OPT=OFF \
            -DCITRA_USE_PRECOMPILED_HEADERS=OFF \
            -DCITRA_WARNINGS_AS_ERRORS=OFF

      - name: Build Azahar libretro backend
        run: |
          set -euo pipefail
          cmake --build build-ios-libretro \
            --target citra_libretro --parallel 3

      - name: Bundle the software core and package unsigned IPA
        run: |
          set -euo pipefail
          app="ios-app/.derived/Build/Products/Release-iphoneos/AzaharIOS.app"
          test -d "$app"
          dylib="$(find build-ios-libretro -name 'azahar_libretro*.dylib' -print -quit)"
          if [[ -z "$dylib" ]]; then
            echo "::error::libretro dylib not produced."
            exit 1
          fi
          echo "Core dylib: $dylib"
          otool -L "$dylib"
          lipo "$dylib" -verify_arch arm64
          mkdir -p "$app/Frameworks"
          cp "$dylib" "$app/Frameworks/azahar_libretro.dylib"
          lipo "$app/AzaharIOS" -verify_arch arm64
          plutil -lint "$app/Info.plist"

          mkdir -p release/Payload
          ditto "$app" release/Payload/AzaharIOS.app
          (
            cd release
            zip -qry azahar-ios-jit-test-unsigned.ipa Payload
            unzip -tq azahar-ios-jit-test-unsigned.ipa
          )
          test -s release/azahar-ios-jit-test-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: azahar-ios-jit-test-unsigned
          path: release/azahar-ios-jit-test-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
