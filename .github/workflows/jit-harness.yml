name: AzaharFE ARM64 JIT Regression Harness
on:
  workflow_dispatch:
    inputs:
      include_macos:
        description: 'Also run native macOS ARM64 regression tests (slower runner queue)'
        type: boolean
        required: false
        default: false
  push:
    branches: [ios-jit-experiment]
    paths:
      - 'tools/jit-harness/**'
      - '.github/workflows/jit-harness.yml'
      - 'src/core/arm/dynarmic/**'
      - 'externals/dynarmic'
      - 'ios-app/patches/dynarmic-host-monitor.patch'
      - 'ios-app/patches/apply-guarded-fastmem.py'
# Keep only the most recent commit in the runner queue. Older attempts are
# still available in Actions history, but do not consume scarce ARM64 runners.
concurrency:
  group: jit-harness-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  arm64-jit-tests:
    name: Run ARM64 JIT tests on ${{ matrix.runner }}
    strategy:
      fail-fast: false
      # A single Linux ARM64 runner runs on every push, instead of waiting for
      # the slower macOS queue. For a full dual-platform check, use Run workflow
      # and select "Also run native macOS ARM64 regression tests".
      matrix:
        runner: ${{ fromJSON(inputs.include_macos && '["ubuntu-24.04-arm","macos-15"]' || '["ubuntu-24.04-arm"]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    steps:
      - name: Checkout exact AzaharFE revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch only pinned Dynarmic and dependencies
        shell: bash
        run: |
          set -euo pipefail
          git submodule update --init --recursive --depth 1 externals/dynarmic
          git -C externals/dynarmic rev-parse HEAD
      - name: Use the compiled ARM64 host lock for exclusive accesses
        run: git -C externals/dynarmic apply "$GITHUB_WORKSPACE/ios-app/patches/dynarmic-host-monitor.patch"

      - name: Patch guarded fastmem emitter
        run: python3 ios-app/patches/apply-guarded-fastmem.py

      - name: Install macOS build tools
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          echo "Host machine: $(uname -m)"
          test "$(uname -m)" = "arm64"
          brew install ninja boost
          cmake --version
          clang++ --version
      - name: Install Linux ARM64 build tools
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          sudo apt-get update
          sudo apt-get install -y ninja-build libboost-dev
      - name: Configure isolated Dynarmic host harness
        shell: bash
        run: |
          set -euo pipefail
          cmake -S tools/jit-harness -B build-jit-harness -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Compile real ARM32-to-ARM64 JIT tests
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build-jit-harness --target azahar_jit_harness --parallel 3
          file build-jit-harness/azahar_jit_harness
      - name: Execute all test cases with per-test timeouts
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir build-jit-harness --output-on-failure \
            --timeout 25 --output-junit ctest-results.xml
      - name: Save regression results even if a test fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azahar-jit-host-regression-results${{ runner.os == 'Linux' && '-linux' || '' }}
          path: build-jit-harness/ctest-results.xml
          if-no-files-found: ignore
          retention-days: 14
