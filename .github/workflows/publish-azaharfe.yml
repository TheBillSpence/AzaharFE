name: Publish AzaharFE IPA

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "Successful iOS build run ID (default: Build #62)"
        required: true
        default: "45386051331"
        type: string
      release_tag:
        description: "New release tag, e.g. v1.0.0"
        required: true
        default: "v1.0.0"
        type: string
      prerelease:
        description: "Mark as a prerelease"
        type: boolean
        default: false

permissions:
  actions: read
  contents: write

concurrency:
  group: azaharfe-release-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ inputs.build_run_id }}
      TAG: ${{ inputs.release_tag }}
      PRERELEASE: ${{ inputs.prerelease }}
    steps:
      - name: Verify successful AzaharFE iPhone build
        id: build
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9][A-Za-z0-9.-]*)?$ ]]
          gh api "repos/$GH_REPO/actions/runs/$RUN_ID" > run.json
          jq -e --arg repo "$GH_REPO" '
            .status == "completed" and
            .conclusion == "success" and
            .head_branch == "ios-jit-experiment" and
            .head_repository.full_name == $repo and
            .path == ".github/workflows/ios-frontend.yml"
          ' run.json > /dev/null
          sha="$(jq -r .head_sha run.json)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "number=$(jq -r .run_number run.json)" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Choose a new version; this workflow never overwrites releases."
            exit 1
          fi
          if gh api "repos/$GH_REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists. Choose a new version."
            exit 1
          fi

      - name: Download and verify the exact IPA artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist download
          gh run download "$RUN_ID" --repo "$GH_REPO" --name azahar-ios-jit-test-unsigned --dir download
          test -s download/azahar-ios-jit-test-unsigned.ipa
          cp download/azahar-ios-jit-test-unsigned.ipa dist/AzaharFE.ipa
          unzip -tq dist/AzaharFE.ipa
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile("dist/AzaharFE.ipa") as ipa:
              files = set(ipa.namelist())
              assert "Payload/AzaharIOS.app/Info.plist" in files
              assert "Payload/AzaharIOS.app/AzaharIOS" in files
              assert "Payload/AzaharIOS.app/Frameworks/azahar_libretro.dylib" in files
          PY
          (cd dist && sha256sum AzaharFE.ipa > AzaharFE.ipa.sha256)

      - name: Publish verified IPA and source information
        env:
          BUILD_SHA: ${{ steps.build.outputs.sha }}
          BUILD_NUMBER: ${{ steps.build.outputs.number }}
        shell: bash
        run: |
          set -euo pipefail
          cat > notes.md <<EOF
          AzaharFE $TAG — independent iPhone frontend fork of Azahar.

          - Unsigned ARM64 IPA; sideload and enable JIT separately if desired.
          - Built by GitHub Actions: https://github.com/$GH_REPO/actions/runs/$RUN_ID
          - Build number: #$BUILD_NUMBER
          - Exact source revision: https://github.com/$GH_REPO/tree/$BUILD_SHA
          - GPL-3.0 license and original upstream notices are retained.
          - To retrieve the corresponding repository source including pinned submodules:
            \`git clone https://github.com/$GH_REPO.git && cd azahar-iOS27_JIT && git checkout $BUILD_SHA && git submodule update --init --recursive\`
          - Build instructions and scripts: https://github.com/$GH_REPO/blob/$BUILD_SHA/.github/workflows/ios-frontend.yml

          SHA-256 checksum is attached alongside the IPA. Successful compilation does not certify compatibility with every device or game.
          EOF
          flags=()
          if [[ "$PRERELEASE" == "true" ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" dist/AzaharFE.ipa dist/AzaharFE.ipa.sha256 \
            --repo "$GH_REPO" --target "$BUILD_SHA" --title "AzaharFE $TAG" \
            --notes-file notes.md "${flags[@]}"
          echo "Published https://github.com/$GH_REPO/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
