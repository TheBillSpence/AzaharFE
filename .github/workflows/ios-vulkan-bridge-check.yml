name: AzaharFE MoltenVK Bridge Fast Compile
on:
  workflow_dispatch:
  push:
    branches: [ios-jit-experiment, SUPER-EXPERIMENTAL]
    paths:
      - 'src/citra_libretro/**'
      - 'src/video_core/renderer_vulkan/**'
      - 'ios-app/AzaharIOS/AzaharEmulator.mm'
      - 'externals/vulkan-headers'
      - 'externals/libretro-common'
      - 'tools/ios-video-tests/**'
      - '.github/workflows/ios-vulkan-bridge-check.yml'

concurrency:
  group: ios-moltenvk-bridge-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bridge-syntax:
    name: Check Vulkan bridge C++ interface (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch only Vulkan and libretro headers
        run: |
          set -euo pipefail
          git submodule update --init --depth 1 externals/vulkan-headers externals/libretro-common
      - name: Install headless Vulkan driver
        run: sudo apt-get update && sudo apt-get install -y libvulkan-dev mesa-vulkan-drivers
      - name: Compile and exercise Vulkan readback
        shell: bash
        run: |
          set -euo pipefail
          clang++ -std=c++20 -DIOS=1 -DENABLE_VULKAN=1 -Isrc \
            -Iexternals/vulkan-headers/include \
            -Iexternals/libretro-common/libretro-common/include \
            src/citra_libretro/ios_moltenvk_bridge.cpp tools/ios-video-tests/readback.cpp \
            -lvulkan -pthread -o "$RUNNER_TEMP/check-readback"
          drivers=(/usr/share/vulkan/icd.d/lvp_icd*.json)
          test -f "${drivers[0]}"
          VK_DRIVER_FILES="${drivers[0]}" timeout 60 "$RUNNER_TEMP/check-readback"
